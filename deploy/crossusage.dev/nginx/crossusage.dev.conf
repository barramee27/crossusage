# crossusage.dev — install as e.g. /etc/nginx/sites-available/crossusage.dev
# then: sudo ln -sf /etc/nginx/sites-available/crossusage.dev /etc/nginx/sites-enabled/
#
# Prerequisites:
#   - DNS A/AAAA for crossusage.dev and www.crossusage.dev → this host
#   - TLS certs (see ../README.md — Certbot)
#   - Site root populated (rsync Next.js `out/` → /var/www/crossusage.dev/html/)
#
# Paths (adjust if you use different layout):
#   Site:     /var/www/crossusage.dev/html
#   Files:    /var/www/crossusage.dev/files   (optional mirrors; no exec, no indexes)
#
# If ssl_dhparam is missing, run: sudo openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
# (or use certbot’s generated file after the first successful issuance).

# ACME HTTP-01 (Certbot "nginx" plugin manages this block in practice; kept for webroot fallback)
server {
    listen 80;
    listen [::]:80;
    server_name crossusage.dev www.crossusage.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://crossusage.dev$request_uri;
    }
}

# Canonical host: apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.crossusage.dev;

    ssl_certificate     /etc/letsencrypt/live/crossusage.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crossusage.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://crossusage.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crossusage.dev;

    root /var/www/crossusage.dev/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/crossusage.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crossusage.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # After first successful HTTPS, keep a modest HSTS; raise max-age (e.g. 31536000) once stable.
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Next.js static export may use small inline bootstraps; tune if you harden further.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Optional: brotli only if your nginx build includes ngx_brotli
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Product polls API (Bun on 127.0.0.1:6740 — see ../polls-api/)
    location ^~ /api/polls/ {
        limit_req zone=polls_vote burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:6740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # CORS is set by the upstream; do not double-add conflicting headers.
    }

    # Versioned release mirrors (no directory listing, no execution)
    location ^~ /files/ {
        alias /var/www/crossusage.dev/files/;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next.js static export (hashed chunks under /_next/static/)
    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 =404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/crossusage.dev.access.log;
    error_log  /var/log/nginx/crossusage.dev.error.log;
}
