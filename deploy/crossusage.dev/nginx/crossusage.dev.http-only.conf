# Bootstrap HTTP-only server (use BEFORE certificates exist)
#
# 1. Copy to sites-available, enable, reload nginx.
# 2. Obtain certs, e.g.:
#      sudo mkdir -p /var/www/certbot
#      sudo certbot certonly --webroot -w /var/www/certbot \
#        -d crossusage.dev -d www.crossusage.dev
# 3. Replace with crossusage.dev.conf (HTTPS) and reload.
#
# Or skip this file and use: sudo certbot --nginx -d crossusage.dev -d www.crossusage.dev
# (the plugin will adjust your active server block).

server {
    listen 80;
    listen [::]:80;
    server_name crossusage.dev www.crossusage.dev;

    root /var/www/crossusage.dev/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 =404 /404.html;
    location = /404.html {
        internal;
    }
}
