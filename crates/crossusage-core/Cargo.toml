[package]
name = "crossusage-core"
version = "1.0.8-beta.1"
description = "Shared plugin engine for CrossUsage (GUI + CLI)"
edition = "2024"

[lib]
name = "crossusage_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22"
log = "0.4"
regex-lite = "0.1.9"
reqwest = { version = "0.13.3", features = ["blocking", "socks"] }
rquickjs = { version = "0.11", features = ["bindgen"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
users = "0.11"
