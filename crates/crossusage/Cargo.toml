[package]
name = "crossusage-cli"
version = "1.0.0"
description = "CrossUsage CLI — terminal interface for the same plugin engine as the GUI"
edition = "2021"

[[bin]]
name = "crossusage-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "cargo"] }
color-eyre = "0.6"
crossterm = "0.28"
crossusage-core = { path = "../crossusage-core" }
dirs = "5"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
owo-colors = "4"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sysinfo = "0.33"
tabled = { version = "0.17", features = ["std"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
