# Build crossusage-cli_<version>_darwin_arm64.tar.gz on Apple Silicon (GitHub-hosted).
#
# This workflow intentionally does **not** run `tauri build` (GUI/.dmg): that needs a full macOS
# app graph (signing, extra plugins) and was flaky in CI. Build the GUI locally or use
# `.github/workflows/publish.yml` when Apple/Tauri signing secrets are configured.
#
# Actions → "macOS CLI tarball" → Run workflow.
# Optional: enable "Upload to latest GitHub Release" so install.sh INSTALL_MODE=cli can fetch the asset.
#
# Artifacts: download from the completed run. Optional: copy the .tar.gz into releases/ on your branch.
name: macOS CLI tarball

on:
  workflow_dispatch:
    inputs:
      upload_to_latest_release:
        description: "Attach darwin_arm64 tarball to latest GitHub Release (--clobber)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tarball:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps and bundle plugins
        run: |
          bun install
          bun run bundle:plugins

      - name: Verify bundled plugins exist
        run: |
          COUNT=$(find src-tauri/resources/bundled_plugins -maxdepth 2 -name plugin.json | wc -l | tr -d ' ')
          if [[ "$COUNT" -lt 1 ]]; then
            echo "No bundled plugins under src-tauri/resources/bundled_plugins after bundle:plugins"
            exit 1
          fi
          echo "Found $COUNT plugin.json files"

      - name: Build portable CLI bundle (native macOS)
        run: ./scripts/build-cli-tarball.sh

      - name: Verify tarball layout includes bundled plugins
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crossusage-cli_*_darwin_arm64.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No darwin_arm64 tarball produced"
            exit 1
          fi
          TARBALL="${files[0]}"
          # macOS bsdtar lists ./resources/...; GNU tar may omit ./
          if ! tar -tzf "$TARBALL" | grep -qE '^(\./)?resources/bundled_plugins/'; then
            echo "Tarball is missing resources/bundled_plugins/: $TARBALL"
            echo "Archive listing (first 30 entries):"
            tar -tzf "$TARBALL" | head -30
            exit 1
          fi
          echo "Verified tarball layout in $TARBALL"

      - name: Upload tarball (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: crossusage-cli-darwin-arm64-tarball
          path: crossusage-cli_*_darwin_arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: tarball
    if: ${{ github.event.inputs.upload_to_latest_release == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download tarball from build job
        uses: actions/download-artifact@v4
        with:
          name: crossusage-cli-darwin-arm64-tarball
          path: release-assets

      - name: Upload to latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-assets
          files=(crossusage-cli_*_darwin_arm64.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No darwin_arm64 tarball in artifact"
            exit 1
          fi
          TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          if [[ "$TAG" == "null" || -z "$TAG" ]]; then
            echo "No GitHub Release found. Create a release first, or commit the tarball under releases/ on your branch."
            exit 1
          fi
          echo "Uploading to release $TAG: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
