# macOS: portable CLI (.tar.gz), GUI (.dmg), portable GUI (.tar.gz of .app).
# Install scripts prefer assets on the latest GitHub Release (see scripts/install.sh / install.ps1).
#
# Actions → "macOS CLI + GUI artifacts" → Run workflow.
# Download workflow artifacts, or enable "Upload to latest GitHub Release".
name: macOS CLI + GUI artifacts

on:
  workflow_dispatch:
    inputs:
      upload_to_latest_release:
        description: "Attach build outputs to the latest GitHub Release (--clobber)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: crossusage-macos-release

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install

      # GHA sets CI=true; some frontend/tooling treats that as "non-interactive" and can break builds.
      - name: Build Tauri (macOS GUI — runs bundle:plugins + CLI sidecar via beforeBuildCommand)
        env:
          CI: ""
        run: |
          unset CI || true
          bun run tauri build

      - name: Build portable CLI tarball (binary + bundled_plugins)
        run: ./scripts/build-cli-tarball.sh

      - name: Pack portable GUI (.app → .tar.gz)
        run: ./scripts/build-gui-portable-macos-tarball.sh

      - name: Verify CLI tarball layout
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(crossusage-cli_*_darwin_arm64.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No darwin_arm64 CLI tarball"
            exit 1
          fi
          T="${files[0]}"
          tar -tzf "$T" | grep -qE '^(\./)?resources/bundled_plugins/' || { echo "bad layout in $T"; exit 1; }
          echo "OK: $T"

      - name: Stage artifacts (upload-artifact needs paths that exist)
        run: |
          set -euo pipefail
          mkdir -p _macos_artifacts
          shopt -s nullglob
          for f in crossusage-cli_*_darwin_arm64.tar.gz crossusage_*_darwin_arm64.tar.gz; do
            [[ -f "$f" ]] && cp -v "$f" _macos_artifacts/
          done
          shopt -u nullglob
          while IFS= read -r -d '' d; do
            cp -v "$d" _macos_artifacts/
          done < <(find target -type f -name '*.dmg' -print0 2>/dev/null)
          echo "==> Staged:"
          ls -la _macos_artifacts/
          n="$(find _macos_artifacts -type f | wc -l | tr -d ' ')"
          if [[ "$n" -lt 2 ]]; then
            echo "Expected at least CLI .tar.gz and one .dmg; got $n file(s). Bundle tree:" >&2
            find target -type d \( -path '*/bundle/dmg' -o -path '*/bundle/macos' \) 2>/dev/null | head -30 >&2 || true
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crossusage-macos-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: _macos_artifacts/*

  publish-release:
    needs: build
    if: ${{ github.event.inputs.upload_to_latest_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: crossusage-macos-release-${{ github.sha }}
          path: release-assets

      - name: Upload to latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t files < <(find . -type f \( -name '*.tar.gz' -o -name '*.dmg' \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No .tar.gz or .dmg in artifact"
            exit 1
          fi
          TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          if [[ "$TAG" == "null" || -z "$TAG" ]]; then
            echo "No GitHub Release found. Create a release first."
            exit 1
          fi
          echo "Uploading to $TAG:"
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
