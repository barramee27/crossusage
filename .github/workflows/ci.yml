name: CI

on:
  pull_request:
    branches: [main, feat/linux-windows-native-support]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-check, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Type-check and build
        run: bun run build

      - name: Run tests
        run: bun run test

  crossusage-cli:
    name: crossusage-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cargo fetch
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if cargo fetch --locked; then
              exit 0
            fi
            echo "cargo fetch attempt ${attempt} failed; retrying..."
            sleep $((attempt * 4))
          done
          exit 1

      - name: Cargo test (crossusage-cli)
        run: cargo test -p crossusage-cli --locked

      - name: Cargo build (crossusage-cli)
        run: cargo build -p crossusage-cli --locked
