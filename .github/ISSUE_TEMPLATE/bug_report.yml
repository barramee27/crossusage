name: Bug Report
description: Report a bug in CrossUsage (Linux & Windows focus)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. In the app: **Settings** → **Troubleshooting** → **Copy log tail** (plain redacted log). Paste it below with your description, or fill the fields. Template file: `.github/ISSUE_TEMPLATE/bug_report.yml`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open CrossUsage
        2. Go to ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CrossUsage version
      description: From Settings footer, About, or the support bundle JSON `appVersion`.
      placeholder: "e.g. 1.0.8"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: CrossUsage targets Linux and Windows; pick the closest match.
      options:
        - Linux
        - Windows
        - Other / upstream OpenUsage (macOS)
    validations:
      required: true
  - type: textarea
    id: log_tail
    attributes:
      label: Log tail (optional)
      description: Paste from Settings → Troubleshooting → Copy log tail (optional).
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drag and drop or paste screenshots here.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Upstream OpenUsage vs this fork, desktop environment (Linux), etc.
